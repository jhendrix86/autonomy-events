syntax = "proto3";

package autonomy.events;

// Event Envelope - Universal wrapper for all events
message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string version = 3;
  int64 timestamp = 4;  // Unix timestamp in milliseconds
  string correlation_id = 5;
  string causation_id = 6;
  string engine_id = 7;
  int32 priority = 8;  // 1=LOW, 2=NORMAL, 3=HIGH, 4=CRITICAL
  int32 retry_count = 9;
  map<string, string> payload = 10;
  map<string, string> metadata = 11;
}

// ========== FUNNEL EVENTS ==========

message FunnelCreated {
  string funnel_id = 1;
  string niche = 2;
  string strategy = 3;
  string governance_status = 4;
  string product_id = 5;
  string target_audience = 6;
  repeated string channels = 7;
  string created_by = 8;
  map<string, string> metadata = 9;
}

message FunnelApproved {
  string funnel_id = 1;
  string approved_by = 2;
  repeated string conditions = 3;
  int64 expires_at = 4;
  string approval_reason = 5;
}

message FunnelLaunched {
  string funnel_id = 1;
  int64 timestamp = 2;
  repeated string channels = 3;
  map<string, string> launch_config = 4;
  string launched_by = 5;
}

message FunnelMetrics {
  string funnel_id = 1;
  int64 timestamp = 2;
  int64 period_start = 3;
  int64 period_end = 4;
  int32 visitors = 5;
  int32 leads = 6;
  int32 conversions = 7;
  double revenue = 8;
  double conversion_rate = 9;
  double cost = 10;
  double roi = 11;
  map<string, string> channel_metrics = 12;
  map<string, string> custom_metrics = 13;
}

message FunnelInsights {
  string funnel_id = 1;
  int64 timestamp = 2;
  repeated string patterns = 3;
  map<string, string> predictions = 4;
  repeated string recommendations = 5;
  double confidence = 6;
  string insight_type = 7;
}

message FunnelMutation {
  string funnel_id = 1;
  string mutation_type = 2;
  string reason = 3;
  map<string, string> expected_impact = 4;
  map<string, string> mutation_config = 5;
  string requested_by = 6;
  string source_funnel_id = 7;
}

message FunnelArchived {
  string funnel_id = 1;
  string reason = 2;
  map<string, string> final_metrics = 3;
  int64 archived_at = 4;
  string archived_by = 5;
  int32 retention_period = 6;
}

// ========== GOVERNANCE EVENTS ==========

message GovernanceRequest {
  string request_id = 1;
  string action_type = 2;
  map<string, string> payload = 3;
  string requester = 4;
  int64 requested_at = 5;
  string priority = 6;
  map<string, string> context = 7;
  string resource_type = 8;
  string resource_id = 9;
}

message GovernanceApproved {
  string request_id = 1;
  string approved_by = 2;
  repeated string conditions = 3;
  int64 expires_at = 4;
  int64 approved_at = 5;
  string approval_token = 6;
  map<string, string> scope = 7;
}

message GovernanceRejected {
  string request_id = 1;
  string rejected_by = 2;
  string reason = 3;
  int64 rejected_at = 4;
  repeated string suggestions = 5;
  string violation_type = 6;
  bool can_retry = 7;
}

message GovernanceEmergencyStop {
  string scope = 1;
  string scope_id = 2;
  string reason = 3;
  string triggered_by = 4;
  int64 triggered_at = 5;
  map<string, string> rollback_plan = 6;
  string severity = 7;
  repeated string affected_entities = 8;
}

message GovernanceOverride {
  string original_request_id = 1;
  string override_by = 2;
  string override_reason = 3;
  int64 override_at = 4;
  string override_token = 5;
  map<string, string> risk_assessment = 6;
  bool requires_approval = 7;
}

// ========== KNOWLEDGE GRAPH EVENTS ==========

message KGEentityCreated {
  string entity_type = 1;
  string entity_id = 2;
  map<string, string> attributes = 3;
  int64 created_at = 4;
  string created_by = 5;
  string source = 6;
  double confidence = 7;
  map<string, string> metadata = 8;
}

message KGRelationshipCreated {
  string from_entity_type = 1;
  string from_entity_id = 2;
  string to_entity_type = 3;
  string to_entity_id = 4;
  string relationship_type = 5;
  map<string, string> attributes = 6;
  int64 created_at = 7;
  string created_by = 8;
  double weight = 9;
  map<string, string> metadata = 10;
}

message KGPatternDetected {
  string pattern_type = 1;
  repeated string entities = 2;
  double confidence = 3;
  int64 detected_at = 4;
  string detected_by = 5;
  map<string, string> pattern_data = 6;
  bool actionable = 7;
  repeated string suggested_actions = 8;
}

message KGInsightGenerated {
  string insight_type = 1;
  repeated string entities = 2;
  string value = 3;
  string source = 4;
  double confidence = 5;
  int64 generated_at = 6;
  string generated_by = 7;
  map<string, string> impact_assessment = 8;
  string priority = 9;
  map<string, string> metadata = 10;
}

message KGAnomalyDetected {
  string anomaly_type = 1;
  repeated string entities = 2;
  string severity = 3;
  int64 detected_at = 4;
  string detected_by = 5;
  map<string, string> anomaly_data = 6;
  string expected_value = 7;
  string actual_value = 8;
  double deviation = 9;
  bool requires_investigation = 10;
}

// ========== SAFETY EVENTS ==========

message SafetyViolationDetected {
  string violation_type = 1;
  string severity = 2;
  string violated_rule = 3;
  string entity_type = 4;
  string entity_id = 5;
  int64 detected_at = 6;
  string detected_by = 7;
  map<string, string> violation_data = 8;
  map<string, string> context = 9;
  bool requires_immediate_action = 10;
  repeated string suggested_actions = 11;
}

message SafetyBlockedAction {
  string action_type = 1;
  string blocked_by = 2;
  string reason = 3;
  string requester = 4;
  int64 blocked_at = 5;
  map<string, string> action_payload = 6;
  string violation_type = 7;
  bool can_override = 8;
  repeated string override_requirements = 9;
}

message SafetyRollbackTriggered {
  string rollback_type = 1;
  string triggered_by = 2;
  string reason = 3;
  int64 triggered_at = 4;
  map<string, string> scope = 5;
  map<string, string> rollback_plan = 6;
  repeated string affected_entities = 7;
  map<string, string> previous_state = 8;
  int32 estimated_duration = 9;
  bool requires_manual_intervention = 10;
}

// ========== HEALTH EVENTS ==========

message EngineHealthReport {
  string engine_id = 1;
  string engine_type = 2;
  string status = 3;
  int64 reported_at = 4;
  int64 uptime_seconds = 5;
  double cpu_usage = 6;
  double memory_usage = 7;
  int32 active_connections = 8;
  int32 queue_depth = 9;
  double error_rate = 10;
  double latency_ms = 11;
  double throughput = 12;
  map<string, string> custom_metrics = 13;
  repeated string dependencies = 14;
}

message EngineDegraded {
  string engine_id = 1;
  string degradation_type = 2;
  string severity = 3;
  int64 detected_at = 4;
  string detected_by = 5;
  repeated string affected_services = 6;
  map<string, string> current_metrics = 7;
  map<string, string> baseline_metrics = 8;
  map<string, string> impact_assessment = 9;
  int32 estimated_recovery_time = 10;
  bool auto_recovery_enabled = 11;
}

message EngineRecovered {
  string engine_id = 1;
  string recovery_type = 2;
  int64 recovered_at = 3;
  int32 degradation_duration = 4;
  string root_cause = 5;
  repeated string recovery_actions = 6;
  map<string, string> post_recovery_metrics = 7;
  bool data_loss = 8;
  bool requires_manual_verification = 9;
}

// ========== FAILURE EVENTS ==========

message FailureDetected {
  string failure_id = 1;
  string failure_type = 2;
  string severity = 3;
  string component = 4;
  string error_message = 5;
  string error_code = 6;
  int64 detected_at = 7;
  string detected_by = 8;
  string stack_trace = 9;
  map<string, string> context = 10;
  repeated string affected_operations = 11;
  bool is_retriable = 12;
  bool requires_manual_intervention = 13;
}

message FailureRecovered {
  string failure_id = 1;
  string recovery_type = 2;
  int64 recovered_at = 3;
  string recovered_by = 4;
  repeated string recovery_actions = 5;
  int32 downtime_seconds = 6;
  bool data_loss = 7;
  string root_cause = 8;
  repeated string preventive_measures = 9;
  bool requires_monitoring = 10;
}

message FailureRetryScheduled {
  string failure_id = 1;
  int32 retry_attempt = 2;
  int32 max_retries = 3;
  int64 scheduled_at = 4;
  int64 retry_at = 5;
  string retry_strategy = 6;
  int32 backoff_seconds = 7;
  string scheduled_by = 8;
  map<string, string> original_payload = 9;
  map<string, string> retry_context = 10;
}

// ========== DLQ EVENTS ==========

message DLQEventFailed {
  string original_event_id = 1;
  string original_event_type = 2;
  string failure_reason = 3;
  string failure_type = 4;
  int64 failed_at = 5;
  string failed_by = 6;
  int32 retry_count = 7;
  map<string, string> original_payload = 8;
  map<string, string> error_details = 9;
  string queue_name = 10;
  int32 priority = 11;
  bool can_replay = 12;
  repeated string replay_conditions = 13;
}

message DLQEventReplayed {
  string original_event_id = 1;
  string replayed_by = 2;
  int64 replayed_at = 3;
  string replay_strategy = 4;
  map<string, string> replay_payload = 5;
  bool replay_success = 6;
  string replay_result = 7;
  int32 replay_duration_ms = 8;
  string error_if_failed = 9;
}

// ========== TEMPORAL EVENTS ==========

message TemporalSnapshot {
  string snapshot_id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string snapshot_type = 4;
  int64 captured_at = 5;
  string captured_by = 6;
  map<string, string> state_data = 7;
  map<string, string> metrics_data = 8;
  map<string, string> config_data = 9;
  string version = 10;
  string checksum = 11;
  int32 retention_period = 12;
  map<string, string> metadata = 13;
}

message CausalChainDetected {
  string chain_id = 1;
  string chain_type = 2;
  int64 detected_at = 3;
  string detected_by = 4;
  repeated string events = 5;
  string root_event_id = 6;
  string leaf_event_id = 7;
  int32 chain_length = 8;
  double confidence = 9;
  map<string, string> impact_assessment = 10;
  bool actionable = 11;
  repeated string suggested_actions = 12;
  map<string, string> metadata = 13;
}
